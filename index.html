<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Mobile Banking</title>
    <!-- daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwind cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#f4f5f7] h-[100vh] flex flex-col justify-center items-center">
    <div class="h-[130px] w-[300px] flex justify-center items-center  bg-[url(./assets/bg.png)] bg-cover">
        <img src="./assets/Group.png" alt="">
    </div>
    <form class=" bg-white rounded-2xl p-8 w-[350px]">
        <div class="mt-5">
            <label for="" class="font-semibold">Mobile Number</label>
            <br>
            <input type="text" placeholder="Enter your number" class="input bg-[#f4f5f7] mt-3 rounded-3xl" />
        </div>
          <div class="mt-5">
            <label for="" class="font-semibold">4 Digit Pin</label>
            <br>
            <input type="text" placeholder="Enter 4 Digit Pin" class="input bg-[#f4f5f7] mt-3 rounded-3xl " />
        </div>
      <button  id="loginButton" class="btn btn-soft btn-primary font-bold mt-5 w-full rounded-3xl">Login</button>
    </form>
    <!-- js script -->
     <script src="./script.js"></script>
</body>
</html>
